# cue.example.yaml: every key is optional except `pools`.
dataDir: .cue-data

node:
  id: cued
  port: 47100            # libeam: rpc=47100, pub=47101, gossip(udp)=47102
  bindAddress: 127.0.0.1
  gossipIntervalMs: 200

limits:
  defaultMaxMinutes: 60
  maxMaxMinutes: 240
  leaseTtlSec: 30
  maxAttempts: 3

isolation:
  kind: systemd-scope    # or: process-group
  memoryMax: 4G
  cpuQuota: 200%
  tasksMax: 512

pools:
  - harness: claude
    account: work
    concurrency: 2
    rate: { jobs: 20, windowSec: 3600 }
    budget: { usd: 25, windowSec: 86400 }   # pause the pool after $25 of finished jobs per day
  - harness: codex
    concurrency: 1
    options:
      sandbox: workspace-write   # or read-only, danger-full-access
      # bypassSandbox: true      # only when the host isolates the process another way
      # config: { model_reasoning_effort: '"high"' }   # codex -c overrides (TOML values)

lanes:                   # concurrency caps across all pools; a disabled lane holds its jobs
  team-a: { concurrency: 1 }
  frozen: { concurrency: 1, enabled: false }

routing:
  - name: investigations-prefer-codex
    match: { labels: [investigate] }
    use: [codex, claude]
  - name: everything-else
    use: [claude:work]

hooks:
  preRun:
    - run: [./hooks/prepare-workspace]   # e.g. create a git worktree, print {"workdir": "..."}
      timeoutSec: 300
  postRun:
    - run: [./hooks/publish-changes]     # e.g. push a branch, open a draft PR
  onComplete:
    - run: [./hooks/record]
      required: false

notify:                  # on: terminal | succeeded | failed | cancelled | timeout | flagged
  - kind: webhook
    url: https://example.com/cue-events
    on: [failed, timeout, flagged]
    # headers: { authorization: "Bearer ..." }
  - kind: command
    run: [./hooks/notify-chat]           # reads $CUE_RESULT_JSON
    on: [terminal]
